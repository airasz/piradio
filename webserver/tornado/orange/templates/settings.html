<script>
  var jsonObj;
  function loadonce() {
    // loadremotes();
    loadconfig();

  function loadremotes() {
    var ajax_request = new XMLHttpRequest();
    var tbl = document.getElementById("state1");
    ajax_request.open("GET", "scmd/remotes", true);
    ajax_request.onreadystatechange = function () {
      if (ajax_request.status == 200) {
        if (ajax_request.readyState == 4) {
          // tbl.innerHTML = ajax_request.responseText;
          jsonObj = JSON.parse(ajax_request.responseText);
          // for (let key in jsonObj) {
          //   if (jsonObj.hasOwnProperty(key)) {
          //     // Check if the key is a direct property of the object
          //     console.log(
          //       `Key: ${key}, Value: ${ajax_request.responseText["name"]}`,
          //     );
          //   }
          // }
          var elements = "";
          for (let i = 0; i < jsonObj.length; i++) {
            console.log(jsonObj[i].name);

            var benable = jsonObj[i].enable ? 'checked="true"' : "";
            // iREMOTES[i]["enable"] is False else "checked=\"true\""

            elements += `<div class=\"switch_led\" style=\"margin: auto; padding: 8px\" ><p4 id=\"swp1\" style=\"font-size: 12px\"> ${i + 1} . ${jsonObj[i].name} </p4><label class=\"switchled\"> <input type=\"checkbox\" ${benable} id=\"remote${i + 1}\" value=\"${jsonObj[i].name}\" onchange=\"rchange(${i + 1})\"/> <span class=\"slider\"></span></label> </div>`;
          }
          tbl.innerHTML = elements;
          console.log("remote>" + ajax_request.responseText);
        }
      } else {
        // document.getElementById("loadingtbl").style.display = "block";
      }
    };
    ajax_request.send();
  }
  function loadconfig() {
    var ajax_request = new XMLHttpRequest();
    var tbl = document.getElementById("state1");
    var plyr = document.getElementById("cfgplayer");
    ajax_request.open("GET", "scmd/config", true);
    ajax_request.onreadystatechange = function () {
      if (ajax_request.status == 200) {
        if (ajax_request.readyState == 4) {
          // tbl.innerHTML = ajax_request.responseText;
          jsonObj = JSON.parse(ajax_request.responseText);
          // for (let key in jsonObj) {
          //   if (jsonObj.hasOwnProperty(key)) {
          //     // Check if the key is a direct property of the object
          //     console.log(
          //       `Key: ${key}, Value: ${ajax_request.responseText["name"]}`,
          //     );
          //   }
          // }
          var elements = "";
          var remotes = jsonObj["remote"];
          for (let i = 0; i < remotes.length; i++) {
            console.log(remotes[i].name);

            var benable = remotes[i].enable ? 'checked="true"' : "";
            // iREMOTES[i]["enable"] is False else "checked=\"true\""

            elements += `<div class=\"switch_led\" style=\"margin: auto; padding: 8px\" ><p4 id=\"swp1\" style=\"font-size: 12px\"> ${i + 1} . ${remotes[i].name} </p4><label class=\"switchled\"> <input type=\"checkbox\" ${benable} id=\"remote${i + 1}\" value=\"${remotes[i].name}\" onchange=\"rchange(${i + 1})\"/> <span class=\"slider\"></span></label> </div>`;
          }
          tbl.innerHTML = elements;
          console.log("remote>" + ajax_request.responseText);
          var ap = "";
          var maxAutoStopValue = jsonObj["max_autostop"];
          // document.getElementById("max_autostop").value = maxAutoStopValue / 60;
          document.getElementById('timeout-display').textContent = maxAutoStopValue / 60;
          var apenable = jsonObj["autoload"] ? 'checked="true"' : "";
          var theme = jsonObj["web"]["client_web_theme"];
          ap += `<div class=\"switch_led\" style=\"margin: auto; padding: 8px\" ><p4 id=\"swp1\" style=\"font-size: 12px\"> 1 . autoload </p4><label class=\"switchled\"> <input id=\"autoload\" type=\"checkbox\" ${apenable}  value=\"autoload\" onchange=\"pconfig(1)\"/> <span class=\"slider\"></span></label> </div>`;
          // ap += `<div class=\"switch_led\" style=\"margin: auto; padding: 8px\" ><p4 id=\"swp1\" style=\"font-size: 12px\"> 2 . web theme </p4><label class=\"switchled\"> <input id=\"theme\" type=\"checkbox\" ${jsonObj["web"]["client_web_theme"]}  value=\"theme\" onchange=\"pconfig(2)\"/> <span class=\"slider\"></span></label> </div>`;
          ap += `<form class="switch_led" action="/setpm" id="p_step1" style="display: block;">
              <p4 id="rmode1" style="font-size: 12px"> 2 . web theme </p4>
              <select name="webtheme" id="webtheme" onchange="cwebtheme()" style="border-color: blue;">
              <option value="-1">select....</option>
              <option value="0" ${theme == 0 ? "selected" : ""}>blurry</option>
              <option value="1" ${theme == 1 ? "selected" : ""}>black border</option>
              <option value="2" ${theme == 2 ? "selected" : ""}>neumorphism</option>
              <option value="3" ${theme == 3 ? "selected" : ""}>glass</option>
              </select>
              <br>
            </form> `;

          plyr.innerHTML = ap;
        }
      } else {
        // document.getElementById("loadingtbl").style.display = "block";
      }
    };
    ajax_request.send();
  }

  // function rchange(id) {
  //   // id -= 1;
  //   var cinput = document.getElementById("remote" + id);
  //   var state = cinput.checked;
  //   console.log("state>" + state);

  let currentInactivityTimeout = 15;


  // Toast element selectors
  const toast = document.getElementById('demo-toast');
  const toastDesc = document.getElementById('demo-toast-desc');

  function triggerToast(message) {
    toastDesc.textContent = message;
    toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
    toast.classList.add('translate-y-0', 'opacity-100');

    setTimeout(() => {
      toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
      toast.classList.remove('translate-y-0', 'opacity-100');
    }, 3000);
  }
  // --- INSTANCE 1: INACTIVITY PICKER (Custom presets, 'minutes' unit) ---
  const timeoutPicker = new CustomNumberPicker({
    title: 'Inactivity Limit',
    subtitle: 'Set maximum allowed inactivity limit before player stop',
    unit: 'minutes',
    presets: [5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60],
    defaultValue: currentInactivityTimeout,
    min: 1,
    max: 65,
    onSubmit: (value) => {
      currentInactivityTimeout = value;
      jsonObj["max_autostop"] = value * 60;
      postplayerrconfig();
      document.getElementById('timeout-display').textContent = value;
      triggerToast(`Inactivity timeout changed to ${value} minutes.`);
    }
  });

  // Wire up buttons to load library instances
  document.getElementById('open-timeout-btn').addEventListener('click', () => {
    // Open the picker synced with the current value
    timeoutPicker.open(currentInactivityTimeout);
  });


  function rchange(id) {
    // id -= 1;
    var cinput = document.getElementById("remote" + id);
    var state = cinput.checked;
    console.log("state>" + state);
    var xhttp = new XMLHttpRequest();
    xhttp.open("POST", "/settings", true);
    xhttp.setRequestHeader("Content-Type", "application/json");
    jsonObj["remote"][id - 1]["enable"] = state;
    var data = JSON.stringify(jsonObj);
    // xhttp.send(data);
    postplayerrconfig();
  }
  function maxAutostopchange() {
    var cinput = document.getElementById("max_autostop_countdown");
    var maxAutoStopvalue = cinput.value;
    jsonObj["max_autostop"] = maxAutoStopvalue * 60;
    postplayerrconfig();
  }
  function postplayerrconfig() {
    var xhttp = new XMLHttpRequest();
    xhttp.open("POST", "/settings", true);
    xhttp.setRequestHeader("Content-Type", "application/json");
    var data = JSON.stringify(jsonObj);
    console.log(data);
    xhttp.send(data);
  }

  function pconfig(id) {
    // id -= 1;
    var cinput = document.getElementById("autoload");
    var state = cinput.checked;
    console.log("state>" + state);
    var xhttp = new XMLHttpRequest();
    xhttp.open("POST", "/settings", true);
    xhttp.setRequestHeader("Content-Type", "application/json");
    jsonObj["autoload"] = state;
    var data = JSON.stringify(jsonObj);
    // xhttp.send(data);
    postplayerrconfig();
  }
  function cwebtheme() {
    var cinput = document.getElementById("webtheme");
    var state = cinput.value;
    console.log("state>" + state);
    var xhttp = new XMLHttpRequest();
    xhttp.open("POST", "/settings", true);
    xhttp.setRequestHeader("Content-Type", "application/json");
    jsonObj["web"]["client_web_theme"] = parseInt(state);
    var data = JSON.stringify(jsonObj);
    // xhttp.send(data);
    postplayerrconfig();
  }
</script>
